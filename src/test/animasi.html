<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>DotLottie Web Component</title>
  <!-- Load Web Component Lottie Terbaru -->
  <script type="module" src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs"></script>
  <style>
    body {
      background-color: #0d0d0e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #161618;
      padding: 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="card">
    <dotlottie-player
      src="cute.lottie"
      background="transparent"
      speed="1"
      style="width: 400px; height: 400px;"
      loop
      autoplay>
    </dotlottie-player>
  </div>

</body>
</html>
