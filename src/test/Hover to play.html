<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Model 2: Hover-to-Play Demo</title>
  <style>
    :root {
      --bg: #0d0d0e;
      --card-bg: #161618;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f4f4f5;
      --text-subtle: #a1a1aa;
      --font-mono: ui-monospace, 'SF Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      padding: 60px 20px;
      display: flex;
      justify-content: center;
    }

    .font-mono { font-family: var(--font-mono); }

    .gallery-container { width: 100%; max-width: 900px; }
    .gallery-header { margin-bottom: 32px; }
    .gallery-title { font-size: 1.25rem; font-weight: 600; }
    .gallery-subtitle { font-size: 0.85rem; color: var(--text-subtle); margin-top: 4px; }

    .filmstrip-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    /* CARD SETUP */
    .filmstrip-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
    }

    .filmstrip-card__viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background-color: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: border-color 0.3s ease, transform 0.3s ease;
    }

    .filmstrip-card:hover .filmstrip-card__viewport {
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-2px);
    }

    /* MEDIA & HOVER STATES */
    .filmstrip-card__still,
    .filmstrip-card__video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .filmstrip-card__still { z-index: 1; opacity: 1; }
    .filmstrip-card__video { z-index: 2; opacity: 0; }

    .filmstrip-card:hover .filmstrip-card__video { opacity: 1; }
    .filmstrip-card:hover .filmstrip-card__still { opacity: 0; }

    /* BADGE TAG */
    .filmstrip-card__badge {
      position: absolute;
      bottom: 12px;
      left: 12px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 0.7rem;
      padding: 4px 10px;
      border-radius: 6px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-icon {
      width: 6px;
      height: 6px;
      background: #a1a1aa;
      border-radius: 50%;
      transition: background 0.3s ease;
    }

    .filmstrip-card:hover .badge-icon { background: #22c55e; }

    /* SIMULATION CANVAS (Pengganti file gambar/video) */
    .demo-canvas {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      background: radial-gradient(circle at center, #27272a 0%, #09090b 100%);
    }

    .demo-loader {
      width: 32px; height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff; border-radius: 50%;
    }

    .is-animating { animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .filmstrip-card__footer {
      display: flex; justify-content: space-between; align-items: center; padding: 0 2px;
    }
    .filmstrip-card__title { font-size: 0.9rem; font-weight: 500; }
    .filmstrip-card__meta { font-size: 0.75rem; color: var(--text-subtle); }
  </style>
</head>
<body>

  <div class="gallery-container">
    <div class="gallery-header">
      <h2 class="gallery-title">Model 2: Hover-to-Play Video Filmstrip</h2>
      <p class="gallery-subtitle font-mono">Arahkan kursor mouse ke kartu untuk memutar animasi</p>
    </div>

    <div class="filmstrip-grid">
      <!-- CARD ITEM 1 -->
      <a href="#" class="filmstrip-card">
        <div class="filmstrip-card__viewport">
          <div class="filmstrip-card__badge font-mono">
            <span class="badge-icon"></span>
            <span>HOVER TO PLAY</span>
          </div>

          <!-- PENGGANTI ASSET ASLI (Nantinya ganti dengan img poster & video mp4) -->
          <div class="filmstrip-card__still demo-canvas">
            <div class="demo-loader"></div>
          </div>
          <div class="filmstrip-card__video demo-canvas">
            <div class="demo-loader is-animating"></div>
          </div>
        </div>

        <div class="filmstrip-card__footer">
          <h3 class="filmstrip-card__title">Dropdown Motion Elastic</h3>
          <span class="filmstrip-card__meta font-mono">MP4 · 60fps</span>
        </div>
      </a>
    </div>
  </div>

</body>
</html>
